def download_csv(url: str, out_path: str):
    print(f"Downloading CSV from: {url}")
    r = requests.get(url, timeout=30)
    r.raise_for_status()
    content = r.content
    Path(out_path).write_bytes(content)
    print(f"Wrote {out_path} ({len(content)} bytes)")

def find_col(df: pd.DataFrame, keywords):
    for c in df.columns:
        lc = c.lower()
        for k in keywords:
            if k in lc:
                return c
    return None

def parse_age(v):
    if pd.isna(v): return np.nan
    s = str(v).strip()
    if s in AGE_MAP:
        return AGE_MAP[s]
    # try numeric
    try:
        return float(s)
    except:
        return np.nan

def parse_income_range(v):
    if pd.isna(v): return np.nan
    s = str(v).strip()
    return INCOME_RANGE_MAP.get(s, np.nan)

def parse_percent_band(v):
    if pd.isna(v): return np.nan
    s = str(v).strip()
    return PERCENT_BAND_MAP.get(s, np.nan)

def parse_yesno(v):
    if pd.isna(v): return 0
    s = str(v).strip().lower()
    return 1 if s.startswith('y') else 0

def parse_invest_where_cell(cell):
    if pd.isna(cell) or str(cell).strip()=='':
        return set()
    items = [p.strip() for p in str(cell).replace(',', ';').split(';') if p.strip()]
    return set(items)

